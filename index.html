<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>FORGE — Mobile Workout App</title>
<style>
:root{--bg:#0b0b0b;--surface:#141414;--surface2:#1b1b1b;--text:#f4f2ed;--muted:#898780;--line:#292929;--accent:#d9ff4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#050505;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh}
button,input{font:inherit}
button{color:inherit}
.app{width:100%;max-width:480px;min-height:100dvh;margin:auto;background:var(--bg);position:relative;overflow:hidden}
.topbar{height:76px;padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:flex-end;padding-bottom:14px;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0b0bee;backdrop-filter:blur(16px);z-index:10}
.logo{font-size:18px;font-weight:950;letter-spacing:-.06em}.logo span{color:var(--accent)}
.iconbtn{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--surface);display:grid;place-items:center}
main{padding:24px 17px calc(105px + env(safe-area-inset-bottom))}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
h1{font-size:43px;line-height:.9;letter-spacing:-.07em;margin:9px 0 28px}
h2{font-size:24px;letter-spacing:-.05em;margin:0}
.day-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 10px;scrollbar-width:none}.day-scroll::-webkit-scrollbar{display:none}
.day{min-width:76px;height:84px;border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:11px;text-align:left;flex:0 0 auto}
.day.active{background:var(--accent);color:#0b0b0b;border-color:var(--accent)}
.day small{display:block;font-size:10px;font-weight:800;opacity:.6;margin-bottom:15px}.day b{font-size:14px}.day em{display:block;font-size:9px;font-style:normal;opacity:.58;margin-top:3px;white-space:nowrap}
.section{margin-top:27px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:11px}.section-head span{font-size:11px;color:var(--muted)}
.exercise{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:9px}
.ex-top{display:flex;justify-content:space-between;gap:12px}.num{font-size:10px;color:var(--muted);margin-bottom:4px}.muscle{font-size:9px;color:var(--accent);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.name{font-size:17px;font-weight:800;letter-spacing:-.035em;margin-top:3px}
.lastbox{text-align:right;font-size:10px;color:var(--muted)}.lastbox strong{display:block;font-size:16px;color:var(--text)}
.target{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}.target-row{display:flex;justify-content:space-between;align-items:center}.target span{font-size:11px;color:var(--muted)}.target b{font-size:13px}.inline-sets{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.setbox{background:#0d0d0d;border:1px solid var(--line);border-radius:11px;padding:8px}.setbox small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;margin-bottom:3px}.setbox input{width:100%;background:none;border:0;outline:0;color:var(--text);font-size:14px;font-weight:800;padding:1px 0}.save-inline{width:100%;border:0;background:var(--accent);color:#080808;border-radius:11px;padding:10px;margin-top:7px;font-size:10px;font-weight:950}.water-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.water-actions button{margin-top:0}.stop-water{background:#242424;color:#fff;border:1px solid var(--line)}
.rest{padding:48px 0}.rest .big{font-size:38px;line-height:.95;letter-spacing:-.06em;font-weight:900;margin:10px 0 15px}.rest p{color:var(--muted);line-height:1.5;font-size:13px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0b0b 22%);z-index:12}
.nav{height:63px;background:#151515;border:1px solid #292929;border-radius:22px;display:flex;gap:3px;padding:5px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:transparent;color:#77746d;border-radius:17px;font-size:9px;font-weight:700;min-width:64px;flex:1}.nav button.active{background:#222;color:#fff}.nav i{display:block;font-style:normal;font-size:17px;margin-bottom:2px}
.timeline-month{border:1px solid var(--line);border-radius:16px;background:var(--surface);margin-bottom:9px;overflow:hidden}.timeline-month summary{list-style:none;cursor:pointer;padding:15px;font-weight:800;display:flex;justify-content:space-between}.timeline-month summary::-webkit-details-marker{display:none}.timeline-items{padding:0 15px 15px;border-top:1px solid var(--line)}.todo-row{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.todo-row:last-child{border-bottom:0}.todo-check{width:20px;height:20px;border:1px solid #555;border-radius:6px;flex:0 0 auto;cursor:pointer;background:#0d0d0d;color:var(--accent);display:grid;place-items:center;font-size:12px}.todo-meta{font-size:9px;color:var(--muted);margin-top:3px}.overdue{border-color:#704040}.money-input{width:100%;box-sizing:border-box;background:#0d0d0d;color:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:20px;font-weight:900;outline:none}.select-input{width:100%;background:#0d0d0d;color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:700}.goal-row{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.goal-row:last-child{border-bottom:0}.goal-check{width:22px;height:22px;border:1px solid #555;border-radius:50%;background:#0d0d0d;color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.sheet-bg{position:fixed;inset:0;background:#000a;display:none;align-items:end;z-index:30}.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:480px;margin:auto;background:#151515;border:1px solid #303030;border-radius:25px 25px 0 0;padding:20px 17px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px #000b}
.grab{width:38px;height:4px;background:#4a4a4a;border-radius:4px;margin:0 auto 20px}.sheet-head{display:flex;justify-content:space-between;align-items:start}.sheet h3{font-size:26px;letter-spacing:-.05em;margin:0}.close{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:35px;height:35px}
.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.inputs label{font-size:9px;color:var(--muted);text-transform:uppercase}.inputs input{width:100%;margin-top:5px;border:1px solid var(--line);background:#0d0d0d;color:#fff;border-radius:12px;padding:13px;font-weight:800}
.save{width:100%;border:0;background:var(--accent);color:#080808;padding:15px;border-radius:14px;font-weight:950;margin-top:15px}
@media(min-width:600px){body{padding:25px 0}.app{min-height:calc(100dvh - 50px);border:1px solid #292929;border-radius:32px;box-shadow:0 30px 100px #000;overflow:hidden}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="logo">FORGE<span>●</span></div><button class="iconbtn" onclick="toast('Profile coming soon')">A</button></header>
<main id="main"></main>
<div class="bottom"><nav class="nav"><button class="active" onclick="nav(this,'home')"><i>⌂</i>Today</button><button onclick="nav(this,'progress')"><i>↗</i>Progress</button><button onclick="nav(this,'diet')"><i>⌁</i>Diet</button><button onclick="nav(this,'investment')"><i>₹</i>Invest</button><button onclick="nav(this,'todo')"><i>✓</i>Todo</button><button onclick="nav(this,'goals')"><i>★</i>Goals</button></nav></div>
</div>
<div class="sheet-bg" id="sheetBg"><div class="sheet">
<div class="grab"></div><div class="sheet-head"><div><div class="eyebrow" id="sheetMuscle"></div><h3 id="sheetName"></h3></div><button class="close" onclick="closeSheet()">×</button></div>
<div class="eyebrow" style="margin-top:22px">SET WEIGHTS · KG</div>
<div class="inputs"><label>Set 1<input id="i1" type="number" step=".5"></label><label>Set 2<input id="i2" type="number" step=".5"></label><label>Set 3<input id="i3" type="number" step=".5"></label></div>
<button class="save" onclick="saveExercise()">SAVE SESSION</button>
</div></div>
<div id="toast" style="position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 15px;border-radius:12px;font-size:12px;font-weight:800;display:none;z-index:50"></div>
<script>
const plan={Monday:["Chest","Triceps"],Tuesday:["Back","Biceps"],Wednesday:["Rest"],Thursday:["Chest","Shoulders"],Friday:["Biceps","Triceps"],Saturday:["Legs"],Sunday:["Rest"]};
const exercises={Chest:["Barbell Bench Press","Incline Dumbbell Press","Cable Fly"],Triceps:["Rope Pushdown","Overhead Cable Extension","Cable Skull Crusher"],Back:["Lat Pulldown","Seated Cable Row","Chest-Supported Row"],Biceps:["Barbell Curl","Incline Dumbbell Curl","Hammer Curl"],Shoulders:["Cable Lateral Raise","Machine Shoulder Press","Rear Delt Fly"],Legs:["Leg Press","Leg Extension","Seated Leg Curl"]};
const defaults={"Barbell Bench Press":40,"Incline Dumbbell Press":12.5,"Cable Fly":15,"Rope Pushdown":20,"Overhead Cable Extension":15,"Cable Skull Crusher":15,"Lat Pulldown":45,"Seated Cable Row":40,"Chest-Supported Row":20,"Barbell Curl":20,"Incline Dumbbell Curl":10,"Hammer Curl":12.5,"Cable Lateral Raise":7.5,"Machine Shoulder Press":30,"Rear Delt Fly":20,"Leg Press":100,"Leg Extension":40,"Seated Leg Curl":35};
let saved=JSON.parse(localStorage.getItem("forgeMobile")||"{}"), selected=new Intl.DateTimeFormat("en-US",{weekday:"long"}).format(new Date()), current="";
const days=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
function getSets(e){
  const value=saved[e];
  if(Array.isArray(value)) return [value[0]??defaults[e]??10,value[1]??defaults[e]??10,value[2]??defaults[e]??10];
  const legacy=typeof value==="number"?value:(defaults[e]??10);
  return [legacy,legacy,legacy];
}
function w(e){return Math.max(...getSets(e))}
function persist(){localStorage.setItem("forgeMobile",JSON.stringify(saved))}
function render(){
let d=new Date();let date=d.toLocaleDateString("en-US",{weekday:"long",day:"numeric",month:"short"});
main.innerHTML=`<div class="eyebrow">${date} · TRAINING LOG</div><h1>What are you<br>training today?</h1>
<div class="day-scroll">${days.map(x=>`<button class="day ${x===selected?"active":""}" onclick="selectDay('${x}')"><small>${x.slice(0,3).toUpperCase()}</small><b>${x}</b><em>${plan[x].join(" + ")}</em></button>`).join("")}</div>
<div id="workoutArea"></div>`;
renderWorkout();
}
function selectDay(d){selected=d;render()}
function renderWorkout(){
let groups=plan[selected], area=document.getElementById("workoutArea");
if(groups[0]==="Rest"){area.innerHTML=`<section class="section rest"><div class="eyebrow">RECOVERY DAY</div><div class="big">Rest today.<br>Come back stronger.</div><p>No workout is scheduled for ${selected}. Recovery is part of progressive overload.</p></section>`;return}
let html=`<section class="section"><div class="section-head"><h2>${groups.join(" + ")}</h2><span>${groups.reduce((a,m)=>a+exercises[m].length,0)} exercises</span></div>`;
let n=0;groups.forEach(m=>exercises[m].forEach(e=>{n++;let sets=getSets(e),last=Math.max(...sets),target=last+2.5;html+=`<article class="exercise"><div class="ex-top"><div><div class="num">${String(n).padStart(2,"0")}</div><div class="muscle">${m}</div><div class="name">${e}</div></div><div class="lastbox">BEST<strong>${last} kg</strong></div></div><div class="target"><div class="target-row"><span>Next target</span><b>${target} kg</b></div><div class="inline-sets"><label class="setbox"><small>Set 1</small><input id="set_${n}_1" type="number" step=".5" value="${sets[0]}"></label><label class="setbox"><small>Set 2</small><input id="set_${n}_2" type="number" step=".5" value="${sets[1]}"></label><label class="setbox"><small>Set 3</small><input id="set_${n}_3" type="number" step=".5" value="${sets[2]}"></label></div><button class="save-inline" onclick="saveInline('${e}',${n})">SAVE EXERCISE</button></div></article>`})); 
area.innerHTML=html+"</section>";
}
function openSheet(e,m){current=e;sheetName.textContent=e;sheetMuscle.textContent=m;let sets=getSets(e);i1.value=sets[0];i2.value=sets[1];i3.value=sets[2];sheetBg.classList.add("open")}
function closeSheet(){sheetBg.classList.remove("open")}
function saveInline(e,n){
  const vals=[1,2,3]
    .map(s=>Number(document.getElementById(`set_${n}_${s}`).value))
    .filter(v=>Number.isFinite(v)&&v>=0);
  if(vals.length){
    saved[e]=[vals[0]??0,vals[1]??0,vals[2]??0];
    persist();
    render();
    toast("Saved · "+saved[e].join(" / ")+" kg");
  }
}
function saveExercise(){
const vals=[Number(i1.value),Number(i2.value),Number(i3.value)].map(v=>Number.isFinite(v)&&v>=0?v:null);
if(vals.some(v=>v!==null)){saved[current]=[vals[0]??0,vals[1]??0,vals[2]??0];persist();closeSheet();render();toast("Workout saved · "+saved[current].join(" / ")+" kg")}
}
function nav(btn,page){
document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
if(page==="home"){render();return}
if(page==="progress"){
main.innerHTML=`<div class="eyebrow">YOUR PROFILE</div><h1>Train with<br>context.</h1>
<div class="exercise"><div class="eyebrow">BODY</div><div class="name" style="margin-top:9px">177 cm · 75 kg</div><p style="color:var(--muted);font-size:12px;line-height:1.5">Your current body stats are shown here so your training and nutrition targets have context.</p></div>
<div class="exercise"><div class="eyebrow">LIFESTYLE</div><div class="name" style="margin-top:9px">Work from home</div><p style="color:var(--muted);font-size:12px;line-height:1.5">Low daily movement can be easy to miss with WFH. Use the diet section to keep meals consistent.</p></div>
<div class="exercise"><div class="eyebrow">PROGRESSIVE OVERLOAD</div><div class="name" style="margin-top:9px">Beat your previous number.</div><p style="color:var(--muted);font-size:12px;line-height:1.5">Every saved exercise remembers your recent best weight and suggests the next target.</p></div>`; return;
}
if(page==="history"){
main.innerHTML=`<div class="eyebrow">SESSION HISTORY</div><h1>Your work,<br>logged.</h1>
<div class="exercise"><div class="name">Workout history</div><p style="color:var(--muted);font-size:12px">Detailed session history will be added next.</p></div>`; return;
}
if(page==="diet"){
main.innerHTML=`<div class="eyebrow">NUTRITION / DAILY ROUTINE</div><h1>Eat for<br>the work.</h1>
<div class="exercise">
<div class="ex-top"><div><div class="muscle">PROFILE</div><div class="name">177 cm · 75 kg</div></div><div class="lastbox">GOAL<strong>LEAN BULK</strong></div></div>
<div class="target"><div class="target-row"><span>Meal consistency</span><b>0 / 5 today</b></div></div>
</div>
<div class="section-head" style="margin-top:22px"><h2>Today's reminders</h2><span>tap to complete</span></div>
${[
["08:30","Breakfast","Oats + milk + peanut butter + banana"],
["13:30","Lunch","Rice + soya + eggs"],
["17:30","Snack","Bread + peanut butter / protein"],
["20:30","Post-workout","Protein + creatine + fluids"],
["22:30","Dinner","Rice + soya + eggs"]
].map((x,i)=>`<div class="exercise" id="meal${i}" onclick="toggleMeal(${i})" style="cursor:pointer">
<div class="ex-top"><div><div class="num">${x[0]}</div><div class="muscle">MEAL ${i+1}</div><div class="name">${x[1]}</div></div><div class="lastbox">○</div></div>
<div style="font-size:11px;color:var(--muted);margin-top:9px">${x[2]}</div></div>`).join("")}
<div class="exercise"><div class="eyebrow">HYDRATION</div><div class="name" style="margin-top:9px">Water reminder</div><div style="display:flex;justify-content:space-between;align-items:end;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#0d0d0d"><div><div style="font-size:9px;color:var(--muted);text-transform:uppercase">Next reminder in</div><div id="waterCountdown" style="font-size:25px;font-weight:900;letter-spacing:-.05em;margin-top:3px">OFF</div></div><div style="text-align:right"><div style="font-size:9px;color:var(--muted);text-transform:uppercase">Current time</div><div id="waterClock" style="font-size:14px;font-weight:800;margin-top:6px">--:--:--</div></div></div><div style="margin-top:12px"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">Reminder interval</div><select id="waterInterval" class="select-input" onchange="setWaterInterval(this.value)"><option value="1">Every 1 hour</option><option value="2">Every 2 hours</option><option value="3">Every 3 hours</option></select></div><p style="color:var(--muted);font-size:12px;margin-bottom:0">Stop reminders to stop the countdown. The countdown follows your phone's local time.</p><button id="waterPushButton" class="save-inline" onclick="toggleWaterPush()">ENABLE WATER NOTIFICATIONS</button></div>`; initWaterUI(); return;
}
}
if(page==="investment"){
main.innerHTML=`<div class="eyebrow">MONEY / INVESTING</div><h1>Make your<br>money work.</h1>
<div class="exercise"><div class="eyebrow">TOTAL INVESTABLE AMOUNT</div><input id="investmentAmount" class="money-input" type="number" min="0" step="100" placeholder="₹ Enter amount" value="${localStorage.getItem("forgeInvestment")||""}" oninput="saveInvestment(this.value)"><p style="color:var(--muted);font-size:11px;margin-bottom:0">Planning tool only. Enter the amount you currently have available to invest.</p></div><div id="investmentInsights"></div>`; renderInvestmentInsights(); return;
}
if(page==="todo"){
main.innerHTML=`<div class="eyebrow">PLANNING / MONTHLY TIMELINE</div><h1>Get things<br>done.</h1>
<div class="exercise"><div class="eyebrow">ADD TODO</div><input id="todoText" class="money-input" style="font-size:15px" placeholder="What needs to be done?"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="todoDate" class="select-input" type="date"><button class="save-inline" style="margin:0" onclick="addTodo()">ADD TODO</button></div></div>
<div class="section-head"><h2>Timeline</h2><span>sample + your tasks</span></div><div id="todoTimeline"></div><div class="section-head" style="margin-top:22px"><h2>Overdue</h2><span>needs attention</span></div><div id="overdueTodos"></div>`; renderTodos(); return;
}
if(page==="goals"){
main.innerHTML=`<div class="eyebrow">GOALS / SKILLS</div><h1>Build your<br>skill stack.</h1>
<div class="exercise"><div class="eyebrow">24-YEAR-OLD SKILL CHECKLIST</div><p style="color:var(--muted);font-size:12px;line-height:1.5">A practical sample checklist. Mark a skill as learned when you can genuinely use it.</p><div id="goalList"></div></div><div class="exercise"><div class="eyebrow">ADD YOUR OWN</div><input id="goalText" class="money-input" style="font-size:15px" placeholder="e.g. System design"><button class="save-inline" onclick="addGoal()">ADD SKILL</button></div>`; renderGoals(); return;
}
function getWaterInterval(){return Number(localStorage.getItem("forgeWaterInterval")||"2")}
function isWaterEnabled(){return localStorage.getItem("forgeWaterEnabled")==="1"}
function nextWaterTime(){const now=new Date(),interval=getWaterInterval(),next=new Date(now);next.setMinutes(0,0,0);let hour=now.getHours()+1;while(hour%interval!==0)hour++;next.setHours(hour);return next}
function updateWaterTimer(){const countdown=document.getElementById("waterCountdown"),clock=document.getElementById("waterClock");if(!countdown||!clock)return;const now=new Date();clock.textContent=now.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});if(!isWaterEnabled()){countdown.textContent="OFF";return}const total=Math.max(0,Math.floor((nextWaterTime()-now)/1000));countdown.textContent=String(Math.floor(total/3600)).padStart(2,"0")+":"+String(Math.floor((total%3600)/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0")}
let waterTimer;
function startWaterTimer(){clearInterval(waterTimer);updateWaterTimer();waterTimer=setInterval(updateWaterTimer,1000)}
function initWaterUI(){const select=document.getElementById("waterInterval"),button=document.getElementById("waterPushButton");if(select)select.value=String(getWaterInterval());if(button)button.textContent=isWaterEnabled()?"STOP WATER NOTIFICATIONS":"ENABLE WATER NOTIFICATIONS";startWaterTimer()}
function setWaterInterval(value){const interval=Math.min(3,Math.max(1,Number(value)||2));localStorage.setItem("forgeWaterInterval",String(interval));if(isWaterEnabled())enableWaterPush(true);else updateWaterTimer()}
async function toggleWaterPush(){if(isWaterEnabled())stopWaterPush();else await enableWaterPush(false)}
function stopWaterPush(){localStorage.setItem("forgeWaterEnabled","0");clearInterval(waterTimer);updateWaterTimer();const button=document.getElementById("waterPushButton");if(button)button.textContent="ENABLE WATER NOTIFICATIONS";toast("Water reminders stopped")}
async function enableWaterPush(silent=false){if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){if(!silent)toast("Push notifications are not supported here");return}try{const permission=await Notification.requestPermission();if(permission!=="granted"){if(!silent)toast("Notification permission is required");return}const registration=await navigator.serviceWorker.ready;const existing=await registration.pushManager.getSubscription();const subscription=existing||await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)});const response=await fetch("/.netlify/functions/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...subscription.toJSON(),interval:getWaterInterval()})});if(!response.ok)throw new Error("Subscription failed");localStorage.setItem("forgeWaterEnabled","1");updateWaterTimer();const button=document.getElementById("waterPushButton");if(button)button.textContent="STOP WATER NOTIFICATIONS";if(!silent)toast("Water notifications enabled ✓")}catch(err){console.error(err);if(!silent)toast("Could not enable notifications")}}

function saveInvestment(value){localStorage.setItem("forgeInvestment",value);renderInvestmentInsights()}
function renderInvestmentInsights(){const box=document.getElementById("investmentInsights");if(!box)return;const amount=Number(localStorage.getItem("forgeInvestment")||0);const insights=amount>0?[["Emergency reserve","Consider keeping a cash buffer for near-term needs and unexpected expenses before investing the full amount."],["Diversification","Research spreading money across diversified assets rather than concentrating everything in one stock, sector, or asset."],["Time horizon","Money needed soon generally calls for different risk and liquidity considerations than long-term money."],["Costs & tax","Compare expense ratios, platform/brokerage fees, liquidity, and applicable taxes before choosing a product."],["Research options","Broad diversified index funds/ETFs are one option to research alongside other regulated investment products. Match the choice to your goals and risk tolerance."]]:[["Start with your number","Enter the amount you can actually invest so FORGE can show planning guidance."],["Define the goal","Decide whether the money is for an emergency buffer, a near-term purchase, or long-term wealth building."],["Check risk & liquidity","Research diversification, fees, liquidity, and downside risk before choosing an investment."]];box.innerHTML=insights.map((x,i)=>`<div class="exercise"><div class="eyebrow">INSIGHT ${i+1}</div><div class="name" style="margin-top:7px">${x[0]}</div><p style="color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:0">${x[1]}</p></div>`).join("")}

const sampleTodos=[{id:"s1",date:"2026-09-05",text:"Review monthly budget",done:false,sample:true},{id:"s2",date:"2026-09-12",text:"Finish portfolio project README",done:false,sample:true},{id:"s3",date:"2026-09-20",text:"Back up important files",done:false,sample:true},{id:"s4",date:"2026-10-03",text:"Complete one React interview module",done:false,sample:true},{id:"s5",date:"2026-10-18",text:"Service / inspect car",done:false,sample:true},{id:"s6",date:"2026-11-08",text:"Complete one system-design practice session",done:false,sample:true}];
function getTodos(){return JSON.parse(localStorage.getItem("forgeTodos")||"[]")}
function addTodo(){const text=document.getElementById("todoText")?.value.trim(),date=document.getElementById("todoDate")?.value;if(!text||!date){toast("Enter a task and date");return}const todos=getTodos();todos.push({id:"t"+Date.now(),date,text,done:false});localStorage.setItem("forgeTodos",JSON.stringify(todos));document.getElementById("todoText").value="";renderTodos();toast("Todo added ✓")}
function toggleTodo(id){const todos=getTodos().map(t=>t.id===id?{...t,done:!t.done}:t);localStorage.setItem("forgeTodos",JSON.stringify(todos));renderTodos()}
function allTodos(){return [...sampleTodos,...getTodos()]}
function renderTodos(){const timeline=document.getElementById("todoTimeline"),overdueBox=document.getElementById("overdueTodos");if(!timeline||!overdueBox)return;const today=new Date();today.setHours(0,0,0,0);const upcoming=allTodos().filter(t=>t.done||new Date(t.date+"T00:00:00")>=today),groups={};upcoming.forEach(t=>{const key=t.date.slice(0,7);(groups[key]??=[]).push(t)});timeline.innerHTML=Object.keys(groups).sort().map((month,i)=>{const items=groups[month].sort((a,b)=>a.date.localeCompare(b.date));return `<details class="timeline-month" ${i===0?"open":""}><summary>${new Date(month+"-01T00:00:00").toLocaleDateString("en-US",{month:"long",year:"numeric"})}<span>${items.length}</span></summary><div class="timeline-items">${items.map(t=>`<div class="todo-row"><button class="todo-check" onclick="toggleTodo('${t.id}')">${t.done?"✓":""}</button><div><b>${t.text}</b><div class="todo-meta">${new Date(t.date+"T00:00:00").toLocaleDateString("en-US",{day:"numeric",month:"short"})}${t.sample?" · SAMPLE":""}</div></div></div>`).join("")}</div></details>`}).join("")||`<div class="exercise"><p style="color:var(--muted);font-size:12px;margin:0">No upcoming todos.</p></div>`;const overdue=allTodos().filter(t=>!t.done&&new Date(t.date+"T00:00:00")<today);overdueBox.innerHTML=overdue.map(t=>`<div class="exercise overdue"><div class="todo-row"><button class="todo-check" onclick="toggleTodo('${t.id}')"></button><div><b>${t.text}</b><div class="todo-meta">Overdue · ${new Date(t.date+"T00:00:00").toLocaleDateString("en-US",{day:"numeric",month:"short"})}</div></div></div></div>`).join("")||`<div class="exercise"><p style="color:var(--muted);font-size:12px;margin:0">Nothing overdue.</p></div>`}

const defaultGoals=["HTML, CSS & modern JavaScript","React & component architecture","Git & GitHub workflow","TypeScript","REST APIs & authentication","SQL & database fundamentals","Node.js & backend fundamentals","Testing & debugging","Docker basics","Cloud fundamentals (AWS/Azure/GCP)","System design fundamentals","Data structures & algorithms","Communication & technical writing","Personal finance & investing basics"];
function getGoals(){return JSON.parse(localStorage.getItem("forgeGoals")||"[]")}
function goalDone(name){return getGoals().some(g=>g.name===name&&g.done)}
function toggleGoal(name){const goals=getGoals(),i=goals.findIndex(g=>g.name===name);if(i<0)goals.push({name,done:true});else goals[i].done=!goals[i].done;localStorage.setItem("forgeGoals",JSON.stringify(goals));renderGoals()}
function addGoal(){const input=document.getElementById("goalText"),name=input?.value.trim();if(!name)return;const goals=getGoals();if(!goals.some(g=>g.name===name))goals.push({name,done:false});localStorage.setItem("forgeGoals",JSON.stringify(goals));input.value="";renderGoals();toast("Skill added ✓")}
function renderGoals(){const box=document.getElementById("goalList");if(!box)return;const custom=getGoals().filter(g=>!defaultGoals.includes(g.name)).map(g=>g.name),names=[...defaultGoals,...custom];box.innerHTML=names.map(name=>`<div class="goal-row"><button class="goal-check" onclick="toggleGoal('${name.replace(/'/g,"\\'")}')">${goalDone(name)?"✓":""}</button><div><b style="${goalDone(name)?"text-decoration:line-through;opacity:.55":""}">${name}</b><div class="todo-meta">${goalDone(name)?"LEARNED":"NOT YET"}</div></div></div>`).join("")}
